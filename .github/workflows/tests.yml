name: tests

# Оффлайновый поднабор тестов: не требует LLM / эмбеддера / Qdrant.
# Закрывает претензию ревью про CI/CD.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install offline test deps
        # Лёгкое подмножество requirements.txt — без torch / sentence-transformers /
        # qdrant-client / streamlit (тестам нужны только парсинг и JSON-логика LLM).
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings openai python-docx python-pptx pytest

      - name: Run offline tests
        # Запуск из корня репозитория (там config.py и пакет veridoc/).
        run: pytest -q
